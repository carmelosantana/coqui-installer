name: Test Installer & Uninstaller

on:
  push:
    branches: ["main"]
    paths:
      - "install.sh"
      - "uninstall.sh"
      - "tests/**"
      - ".github/workflows/test-installer.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "install.sh"
      - "uninstall.sh"
      - "tests/**"
      - ".github/workflows/test-installer.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Lint ─────────────────────────────────────────────────────────────────────

jobs:
  lint-shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint install.sh
        run: shellcheck --severity=warning install.sh

      - name: Lint uninstall.sh
        run: shellcheck --severity=warning uninstall.sh

# ─── Bash tests (Linux) ───────────────────────────────────────────────────────

  test-linux:
    name: Bash tests (Linux / Ubuntu)
    runs-on: ubuntu-latest
    needs: [lint-shell]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run bats test suites
        run: |
          bats --tap tests/test_install.bats
          bats --tap tests/test_uninstall.bats
          bats --tap tests/test_wrapper.bats
          bats --tap tests/test_no_powershell.bats
          bats --tap tests/test_fetch_coqui.bats
          bats --tap tests/test_fetch_web.bats
          bats --tap tests/test_entrypoint.bats
          bats --tap tests/test_compose.bats

# ─── Bash tests (macOS) ───────────────────────────────────────────────────────

  test-macos:
    name: Bash tests (macOS)
    runs-on: macos-latest
    needs: [lint-shell]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: brew install bats-core

      - name: Run bats test suites
        run: |
          bats --tap tests/test_install.bats
          bats --tap tests/test_uninstall.bats
          bats --tap tests/test_wrapper.bats
          bats --tap tests/test_no_powershell.bats
          bats --tap tests/test_fetch_coqui.bats
          bats --tap tests/test_fetch_web.bats
          bats --tap tests/test_entrypoint.bats
          bats --tap tests/test_compose.bats

# ─── Summary ──────────────────────────────────────────────────────────────────

  all-tests-passed:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: [lint-shell, test-linux, test-macos]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint-shell.result }}" != "success" ]] || \
             [[ "${{ needs.test-linux.result }}" != "success" ]] || \
             [[ "${{ needs.test-macos.result }}" != "success" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed."
